apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 5
  revisionHistoryLimit: 5
  minReadySeconds: 0
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: nginx:1.19
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 3"]
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 1
          periodSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
      - name: multitool
        image: wbitt/network-multitool:alpine-extra
        env:
        - name: HTTP_PORT
          value: '8080'
        - name: HTTPS_PORT
          value: '8443'
        ports:
        - name: multitool-http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: multitool-http
          initialDelaySeconds: 1
          periodSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
