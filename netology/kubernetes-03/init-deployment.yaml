apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-init
  template:
    metadata:
      labels:
        app: nginx-init
    spec:
      initContainers:
        - name: wait-service
          image: busybox:1.37
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              until nslookup "nginx-init-svc.${POD_NAMESPACE}.svc.cluster.local."; do
                echo "Waiting for nginx-init-svc"
                sleep 2
              done
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
