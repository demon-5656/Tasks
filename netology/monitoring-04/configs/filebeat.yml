filebeat.autodiscover:
  providers:
    - type: docker
      host: unix:///var/run/docker.sock
      templates:
        - condition:
            equals:
              docker.container.labels.course: netology-elk
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
processors:
  - add_docker_metadata:
      host: unix:///var/run/docker.sock
output.logstash:
  hosts: ["logstash:5046"]
logging.level: warning
logging.metrics.enabled: false
