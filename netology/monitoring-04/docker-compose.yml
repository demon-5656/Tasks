name: monitoring-04
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"
x-es: &es
  image: elasticsearch:8.7.0
  restart: unless-stopped
  logging: *logging
  labels:
    course: netology-elk
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
services:
  es-hot:
    <<: *es
    environment:
      node.name: es-hot
      cluster.name: netology-elk
      discovery.seed_hosts: es-hot,es-warm
      cluster.initial_master_nodes: es-hot,es-warm
      node.roles: master,data_content,data_hot
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - hot_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
  es-warm:
    <<: *es
    environment:
      node.name: es-warm
      cluster.name: netology-elk
      discovery.seed_hosts: es-hot,es-warm
      cluster.initial_master_nodes: es-hot,es-warm
      node.roles: master,data_warm
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - warm_data:/usr/share/elasticsearch/data
  kibana:
    image: kibana:8.7.0
    restart: unless-stopped
    logging: *logging
    labels:
      course: netology-elk
    environment:
      ELASTICSEARCH_HOSTS: '["http://es-hot:9200","http://es-warm:9200"]'
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on: [es-hot, es-warm]
  logstash:
    image: logstash:8.7.0
    restart: unless-stopped
    logging: *logging
    labels:
      course: netology-elk
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./configs/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./configs/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./configs/logstash-template.json:/usr/share/logstash/config/logstash-template.json:ro
    ports:
      - "127.0.0.1:5044:5044"
    depends_on: [es-hot, es-warm]
  filebeat:
    image: elastic/filebeat:8.7.0
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    logging: *logging
    volumes:
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on: [logstash]
  dummy:
    image: python:3.12-slim
    profiles: [demo]
    command: ["python", "-u", "/app/dummy.py"]
    logging: *logging
    labels:
      course: netology-elk
    volumes:
      - ./dummy.py:/app/dummy.py:ro
volumes:
  hot_data:
  warm_data:
  filebeat_data:
