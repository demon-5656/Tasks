global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    timeout connect 2s
    timeout client 10s
    timeout server 10s
    retries 3
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend web_listener
    bind :8080
    default_backend lamp_group

backend lamp_group
    balance roundrobin
    option httpchk GET /health.php
    http-check expect status 200
    default-server inter 1s fall 2 rise 1
    server-template web 3 web:80 check resolvers docker init-addr libc,none resolve-prefer ipv4

listen metrics
    bind :9000
    mode http
    stats enable
    stats uri /stats
