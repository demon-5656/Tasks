#cloud-config
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - gnupg

write_files:
  - path: /root/${app_name}.env
    owner: root:root
    permissions: "0600"
    content: |
      WEB_PORT=80
      PUBLIC_BASE_URL=${public_base_url}
      CR_REGISTRY=${registry_url}
      IMAGE_TAG=${image_tag}

      JWT_SECRET=${jwt_secret}

      MYSQL_HOST=${mysql_host}
      MYSQL_PORT=3306
      MYSQL_DATABASE=${mysql_database}
      MYSQL_USER=${mysql_user}
      MYSQL_PASSWORD=${mysql_password}
      MYSQL_SSL=true

      SMTP_HOST=${smtp_host}
      SMTP_PORT=${smtp_port}
      SMTP_SECURE=${smtp_secure}
      SMTP_USER=${smtp_user}
      SMTP_PASSWORD=${smtp_password}
      SMTP_FROM=${smtp_from}

  - path: /root/bootstrap-${app_name}.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      app_dir="/opt/${app_name}"
      install -m 0755 -d /etc/apt/keyrings "$app_dir"

      rm -f /etc/apt/keyrings/docker.gpg
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker

      cp /root/${app_name}.env "$app_dir/.env"
      cp /root/docker-compose.${app_name}.yml "$app_dir/docker-compose.cloud.yml"

      iam_token="$(curl -fsS -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
      echo "$iam_token" | docker login --username iam --password-stdin cr.yandex

      cd "$app_dir"
      docker compose --env-file .env -f docker-compose.cloud.yml up -d

  - path: /root/docker-compose.${app_name}.yml
    owner: root:root
    permissions: "0600"
    content: |
      services:
        web:
          image: ${registry_url}/${app_name}-web:${image_tag}
          ports:
            - "80:80"
          depends_on:
            - api
          restart: unless-stopped

        api:
          image: ${registry_url}/${app_name}-api:${image_tag}
          environment:
            API_PORT: 3000
            PUBLIC_BASE_URL: "${public_base_url}"
            JWT_SECRET: "${jwt_secret}"
            MYSQL_HOST: "${mysql_host}"
            MYSQL_PORT: 3306
            MYSQL_USER: "${mysql_user}"
            MYSQL_PASSWORD: "${mysql_password}"
            MYSQL_DATABASE: "${mysql_database}"
            MYSQL_SSL: "true"
            SMTP_HOST: "${smtp_host}"
            SMTP_PORT: ${smtp_port}
            SMTP_SECURE: "${smtp_secure}"
            SMTP_USER: "${smtp_user}"
            SMTP_PASSWORD: "${smtp_password}"
            SMTP_FROM: "${smtp_from}"
          restart: unless-stopped

runcmd:
  - bash /root/bootstrap-${app_name}.sh
