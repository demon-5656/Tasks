apiVersion: v1
kind: PersistentVolume
metadata:
  name: lesson05-manual-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  hostPath:
    path: /var/local/netology-storage/lesson05-manual
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - microk8s-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-pvc
spec:
  volumeName: lesson05-manual-pv
  storageClassName: ''
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
      - name: busybox
        image: busybox:1.37
        command:
        - sh
        - -c
        - while true; do date -u +%Y-%m-%dT%H:%M:%SZ >> /data/shared.log; sleep 5;
          done
        volumeMounts:
        - name: shared-data
          mountPath: /data
      - name: multitool
        image: wbitt/network-multitool:alpine-extra
        volumeMounts:
        - name: shared-data
          mountPath: /data
          readOnly: true
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: manual-pvc
