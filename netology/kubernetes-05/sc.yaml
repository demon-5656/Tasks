apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lesson05-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lesson05-sc-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: lesson05-local
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - microk8s-lab
  local:
    path: /var/local/netology-storage/lesson05-sc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: class-pvc
spec:
  storageClassName: lesson05-local
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
      - name: busybox
        image: busybox:1.37
        command:
        - sh
        - -c
        - while true; do date -u +%Y-%m-%dT%H:%M:%SZ >> /data/shared.log; sleep 5;
          done
        volumeMounts:
        - name: shared-data
          mountPath: /data
      - name: multitool
        image: wbitt/network-multitool:alpine-extra
        volumeMounts:
        - name: shared-data
          mountPath: /data
          readOnly: true
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: class-pvc
